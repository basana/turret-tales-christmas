<style>

  html, body { margin: 0; background: var(--cream); color: var(--ink); font-family: 'EB Garamond', Georgia, serif; }

  .langs { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin: 14px 0 6px; }
  .langs button { font-family: Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 14px; border: 1px solid var(--maroon); background: #fff; color: var(--maroon); cursor: pointer; }
  .langs button.active { background: var(--maroon); color: #fff; }
  .intro { background: var(--paper); border: 1px solid var(--gold); border-radius: 12px; padding: 14px 16px; margin: 14px 0; font-size: 17px; line-height: 1.5; }

  .sec { font-size: 22px; color: var(--maroon); margin: 22px 0 10px; font-weight: 700; border-bottom: 1px solid var(--gold); padding-bottom: 4px; scroll-margin-top: 12px; }
  .card { background: var(--paper); border: 1px solid var(--gold); border-radius: 12px; padding: 12px; margin: 0 0 12px; display: flex; gap: 12px; align-items: center; }
  .card .num { font-family: Helvetica, Arial, sans-serif; font-weight: 700; color: var(--maroon); font-size: 14px; min-width: 26px; }
  .card .ph { flex: 1; border: 1px dashed var(--maroon); border-radius: 8px; padding: 14px 10px; text-align: center; color: var(--maroon); font-size: 15px; }
  .partner { background: var(--paper); border: 1px solid var(--gold); border-radius: 12px; padding: 14px; margin: 0 0 12px; scroll-margin-top: 12px; }
  .partner-head { display: flex; gap: 12px; align-items: center; }
  .partner-icon { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid var(--maroon); flex: none; background: #fff; }
  .partner-name { font-size: 21px; font-weight: 700; color: var(--maroon); margin: 0; line-height: 1.2; }
  .partner-cat { font-family: Helvetica, Arial, sans-serif; font-size: 12px; color: var(--soft); margin-top: 2px; }
  .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 12px 0 10px; }
  .gallery img { width: 100%; height: auto; border-radius: 8px; display: block; }
  .gallery img:first-child { grid-column: span 2; }
  .gallery .gallery-text { font-size: 14px; line-height: 1.4; margin: 0; align-self: start; }
  .gallery .gallery-text .partner-meta { margin: 8px 0 0; font-size: 13px; }
  .photo-slot { border: 1px dashed var(--maroon); border-radius: 8px; padding: 22px 10px; text-align: center; color: var(--maroon); font-size: 14px; margin: 12px 0 10px; }
  .partner-desc { font-size: 17px; line-height: 1.5; margin: 0 0 10px; }
  .partner-meta { font-family: Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.6; color: var(--ink); margin: 0; }
  .partner-meta dt { display: inline; font-weight: 700; color: var(--maroon); }
  .partner-meta dd { display: inline; margin: 0; }
  .partner-meta div { margin: 0 0 2px; }
  .partner-meta a { color: var(--maroon); }
  .pending { color: var(--soft); font-style: italic; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .btn { font-family: Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 14px; border: 1px solid var(--maroon); background: #fff; color: var(--maroon); cursor: pointer; text-decoration: none; display: inline-block; }
  .btn.solid { background: var(--maroon); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .partner-link { display: inline-block; margin-top: 10px; font-family: Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; padding: 7px 14px; border-radius: 14px; background: var(--maroon); color: #fff; text-decoration: none; }
  .contact { margin-top: 22px; background: var(--paper); border: 1px solid var(--gold); border-radius: 12px; padding: 14px 16px; font-size: 16px; line-height: 1.5; }
  .contact a { color: var(--maroon); }
  .legal { margin-top: 18px; padding-top: 10px; border-top: 1px solid rgba(122,16,38,.25); font-family: Helvetica, Arial, sans-serif; font-size: 12px; color: var(--soft); text-align: center; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #C0202A; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .pin { width: 56px; height: 56px; border-radius: 50%; background: #fff; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--maroon), 0 3px 8px rgba(0,0,0,.35); overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .pin img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pin span { font-family: Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; color: var(--maroon); }
  .modal { position: fixed; inset: 0; background: rgba(40,20,10,.55); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal.open { display: flex; }
  .coupon { background: var(--paper); border: 2px solid var(--maroon); border-radius: 14px; padding: 18px; width: 100%; max-width: 380px; text-align: center; position: relative; }
  .coupon .brand2 { font-family: Helvetica, Arial, sans-serif; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
  .coupon h3 { font-size: 24px; color: var(--maroon); margin: 6px 0 4px; }
  .coupon .offer { font-size: 17px; margin: 0 0 10px; }
  .coupon .qr { display: inline-block; padding: 8px; background: #fff; border: 1px solid var(--gold); border-radius: 8px; min-height: 60px; }
  .coupon .code { font-family: Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: .08em; margin: 10px 0 2px; color: var(--ink); }
  .coupon .valid { font-family: Helvetica, Arial, sans-serif; font-size: 12px; color: var(--soft); }
  .coupon .demo { position: absolute; top: 10px; right: 10px; font-family: Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; color: #fff; background: var(--maroon); padding: 3px 7px; border-radius: 8px; }
  .coupon .state { margin-top: 12px; font-family: Helvetica, Arial, sans-serif; font-size: 14px; min-height: 20px; }
  .coupon .state.ok { color: var(--ok); font-weight: 700; }
  .coupon .row { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  .coupon .closer { margin-top: 12px; }
  .gps-box { background: var(--paper); border: 1px solid var(--gold); border-radius: 12px; padding: 12px 14px; margin: 0 0 12px; }
  .gps-hint { font-family: Helvetica, Arial, sans-serif; font-size: 13px; color: var(--soft); margin: 8px 0 0; line-height: 1.4; }
  .gps-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 8px 0; border-top: 1px solid rgba(201,160,92,.4); font-family: Helvetica, Arial, sans-serif; font-size: 14px; }
  .gps-row:first-child { border-top: 0; }
  .gps-row .nm { flex: 1 1 100%; font-weight: 700; color: var(--maroon); }
  .gps-row .nm a { color: var(--maroon); }
  .gps-row small { color: var(--soft); }
  .gps-row a.route { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--maroon); }
  .gps-ship { font-family: Helvetica, Arial, sans-serif; font-size: 14px; margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--gold); }
  .gps-time { font-family: Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; margin: 6px 0; }
  .gps-time.ok { color: var(--ok); }
  .gps-time.late { color: #b3261e; }
  .gps-depart { font-family: Helvetica, Arial, sans-serif; font-size: 13px; color: var(--soft); display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .gps-depart input { font-size: 14px; padding: 4px 6px; border: 1px solid var(--gold); border-radius: 6px; background: #fff; }
  .gps-user-halo { width: 22px; height: 22px; border-radius: 50%; background: #2a7de1; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(42,125,225,.25), 0 1px 4px rgba(0,0,0,.4); }
  .saved-spot-marker { font-size: 26px; line-height: 30px; text-align: center; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  .ptabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 8px 0 14px; }
  .ptabs button { font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; padding: 9px 18px; border-radius: 18px; border: 2px solid var(--maroon); background: #fff; color: var(--maroon); cursor: pointer; }
  .ptabs button.active { background: var(--maroon); color: #fff; }
  .wine-sec { margin: 0 0 10px; }
  :root { --terracotta:#B5602E; --cream-text:#FCEFDD; --sans: Helvetica, Arial, sans-serif; --pad: clamp(16px, 5vw, 24px); }
  /* Заставка при открытии (как «Food & Drinks» в приложении) */
  .splash { position: fixed; inset: 0; z-index: 3000; display: flex; flex-direction: column; justify-content: flex-end; background: #1a100a; }
  .splash[hidden] { display: none; }
  .splash > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; }
  .splash-gradient { position: absolute; inset: 0; background: linear-gradient(45deg, rgba(12,8,4,0.82) 0%, rgba(12,8,4,0.55) 20%, rgba(12,8,4,0.22) 38%, rgba(12,8,4,0) 56%); }
  .splash-watermark-wrap { --wm: clamp(96px, 32vw, 150px); position: absolute; z-index: 0; pointer-events: none; top: env(safe-area-inset-top); left: 0; width: calc(var(--wm) * 0.765); height: calc(var(--wm) * 0.765); }
  .splash img.splash-watermark { position: absolute; z-index: 1; pointer-events: none; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0.9; }
  .splash-content { position: relative; z-index: 1; padding: 0 var(--pad) calc(118px + env(safe-area-inset-bottom)); color: var(--cream-text); }
  .splash-eyebrow { font-family: var(--sans); font-size: 12.4px; letter-spacing: 0.19em; text-transform: uppercase; color: var(--cream-text); font-weight: 700; opacity: 0.86; margin: 0 0 6px; text-shadow: 0 2px 10px rgba(0,0,0,0.65), 0 1px 3px rgba(0,0,0,0.8); display: block; transform: translateY(-5%); }
  .splash-title, .splash-find { font-family: 'EB Garamond', Garamond, serif; font-weight: 600; font-style: normal; font-synthesis: none; font-size: clamp(30px, 8.3vw, 42px); line-height: 1.05; text-shadow: 0 2px 16px rgba(0,0,0,0.45); }
  .splash-title, .splash-find { color: var(--cream-text); }
  .splash-title { margin: 0 0 9px; }
  .splash-find { display: block; text-align: left; margin: 0 0 26px; padding-left: 19%; font-size: calc(clamp(30px, 8.3vw, 42px) * 0.77); font-style: italic; font-synthesis: style; }
  .splash-tagline { font-size: clamp(19px, 5vw, 21px); line-height: 1.42; margin: 0 0 22px; max-width: 34ch; color: rgba(252,239,221,0.92); }
  .splash-enter { font-family: var(--sans); background: var(--terracotta); color: var(--cream-text); border: none; border-radius: 28px; padding: 14px 30px; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .splash-lang { position: absolute; z-index: 2; top: calc(14px + env(safe-area-inset-top)); right: 14px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: 70%; }
  .splash-lang-btn { font-family: var(--sans); font-size: 11.5px; font-weight: 700; padding: 6px 10px; border-radius: 14px; cursor: pointer; background: #fff; color: #7A1026; border: 1px solid #7A1026; }
  .splash-lang-btn.active { background: var(--terracotta); color: var(--cream-text); border-color: var(--terracotta); }

  /* ============ RTL (иврит) ============ */
  [dir="rtl"] body { direction: rtl; }
  [dir="rtl"] .splash-find { text-align: right; padding-left: 0; padding-right: 19%; }
  [dir="rtl"] .splash-lang { right: auto; left: 14px; justify-content: flex-start; }
  [dir="rtl"] .gps-row a.route { margin-left: 0; margin-right: auto; }
</style>

function partnerCard(p, n) {
  const t = T[lang];

    ? `<div><dt>Web:</dt> <dd><a href="${p.web}" target="_blank" rel="noopener">${p.web.replace('https://', '')}</a></dd></div>` : '';
  const meta = `<dl class="partner-meta">
      <div><dt>${t.addr}:</dt> <dd>${val(p.addr)}</dd></div>
      <div><dt>${t.hours}:</dt> <dd>${val(hours)}</dd></div>

  const cells = photos.map((src, i) =>
    `<img src="${src}" alt="${i === 0 && p.photoAlt ? p.photoAlt : p.name}" loading="lazy">`);
  if (hasSlot) cells.splice(p.textSlot, 0, `<div class="gallery-text">${descText}${meta}</div>`);
  const photo = photos.length
    ? `<div class="gallery">${cells.join('')}</div>`
    : `<div class="photo-slot">${t.photoSlot}</div>`;
  const link = p.gmaps
    ? `<a class="partner-link" href="${p.gmaps}" target="_blank" rel="noopener">${t.gmaps} →</a>` : '';
  const coupon = COUPON[p.slug]
    ? `<button class="btn solid" data-coupon="${p.slug}">${t.couponBtn}</button>` : '';
  return `<article class="partner" id="card-${p.slug}">
    <div class="partner-head">
      ${avatar(p)}
      <div>
        <h3 class="partner-name">${String(n).padStart(2, '0')} · ${p.name}</h3>
        <div class="partner-cat">${p.cat[lang] || p.cat.en}</div>
      </div>
    </div>
    ${photo}
    ${hasSlot ? '' : `<p class="partner-desc">${descText}</p>`}
    ${hasSlot ? '' : meta}
    <div class="btns">${link}${coupon}</div>
  </article>`;
}

function openCoupon(slug) {
  const c = COUPON[slug];

  openFor = slug;
  const t = T[lang];
  document.getElementById('cp-brand').textContent = t.cpBrand;
  document.getElementById('cp-title').textContent = c.name;

  document.getElementById('cp-code').textContent = c.code;

  renderCoupon();
  document.getElementById('cp-modal').classList.add('open');
}
function renderCoupon() {
  const t = T[lang];
  const st = document.getElementById('cp-state');

  document.getElementById('cp-redeem').textContent = t.redeem;
  document.getElementById('cp-close').textContent = t.close;
  document.getElementById('cp-reset').textContent = RESET[lang] || RESET.en;
  if (!openFor) return;
  if (redeemed[openFor]) {
    st.textContent = t.redeemed;
    st.className = 'state ok';
    btn.disabled = true;
  } else {
    st.textContent = t.notRedeemed;
    st.className = 'state';
    btn.disabled = false;
  }
}
document.getElementById('cp-redeem').addEventListener('click', () => {

  redeemed[openFor] = true;

});
document.getElementById('cp-reset').addEventListener('click', () => {
  Object.keys(redeemed).forEach(k => delete redeemed[k]);

document.getElementById('cp-modal').addEventListener('click', e => { if (e.target.id === 'cp-modal') e.target.classList.remove('open'); });

// GPS navigation: same logic as the main app (straight line x 1.3 detour, 75 m/min walking)
const GPS = {
  de: { btn: 'GPS · Entfernungen', locating: 'Standort wird ermittelt …', err: 'GPS nicht verfügbar', saveShip: 'Meinen Ort merken', clearShip: 'Ort entfernen', shipPrompt: 'Name für diesen Ort (z. B. „Schiff“, „Bus“):', shipDefault: 'Mein Ort', min: 'Min. zu Fuß', departLabel: 'Abfahrtszeit', enough: 'Zeit reicht, ca. {n} Min. Reserve', notEnough: 'Achtung: ca. {n} Min. zu spät', route: 'Route', tap: 'Oder tippen Sie auf die Karte, um Ihren Punkt zu setzen.' },
  en: { btn: 'GPS · Distances', locating: 'Locating…', err: 'GPS not available', saveShip: 'Save my spot', clearShip: 'Remove spot', shipPrompt: 'Label this spot (e.g. "Ship", "Bus"):', shipDefault: 'My spot', min: 'min walk', departLabel: 'Departure time', enough: 'Enough time, about {n} min to spare', notEnough: 'Warning: about {n} min too late', route: 'Route', tap: 'Or tap the map to set your spot.' },
  fr: { btn: 'GPS · Distances', locating: 'Localisation…', err: 'GPS indisponible', saveShip: 'Mémoriser ce lieu', clearShip: 'Supprimer le lieu', shipPrompt: 'Nom de ce lieu (ex. « Bateau », « Bus ») :', shipDefault: 'Mon lieu', min: 'min à pied', departLabel: 'Heure de départ', enough: 'Le temps suffit, environ {n} min de marge', notEnough: 'Attention : environ {n} min de retard', route: 'Itinéraire', tap: 'Ou touchez la carte pour placer votre point.' },
  nl: { btn: 'GPS · Afstanden', locating: 'Locatie wordt bepaald…', err: 'GPS niet beschikbaar', saveShip: 'Mijn plek opslaan', clearShip: 'Plek verwijderen', shipPrompt: 'Naam voor deze plek (bv. "Schip", "Bus"):', shipDefault: 'Mijn plek', min: 'min lopen', departLabel: 'Vertrektijd', enough: 'Tijd genoeg, ca. {n} min. marge', notEnough: 'Let op: ca. {n} min. te laat', route: 'Route', tap: 'Of tik op de kaart om uw punt te zetten.' },
  ru: { btn: 'GPS · Расстояния', locating: 'Определяем местоположение…', err: 'GPS недоступен', saveShip: 'Запомнить место', clearShip: 'Убрать место', shipPrompt: 'Название места (например, «Корабль», «Автобус»):', shipDefault: 'Моё место', min: 'мин пешком', departLabel: 'Время отхода', enough: 'Времени хватает, запас около {n} мин', notEnough: 'Не успеваете примерно на {n} мин', route: 'Маршрут', tap: 'Или нажмите на карту, чтобы поставить свою точку.' },
  zh: { btn: 'GPS · 距离', locating: '正在定位…', err: 'GPS 不可用', saveShip: '记住我的位置', clearShip: '移除位置', shipPrompt: '为此位置命名（例如"船"、"巴士"）：', shipDefault: '我的位置', min: '分钟步行', departLabel: '出发时间', enough: '时间充裕，约剩 {n} 分钟', notEnough: '注意：大约会迟到 {n} 分钟', route: '路线', tap: '或点击地图设置您的位置。' },
  he: { btn: 'GPS · מרחקים', locating: 'מאתר מיקום…', err: 'GPS לא זמין', saveShip: 'שמירת המיקום שלי', clearShip: 'הסרת המיקום', shipPrompt: 'שם למיקום זה (לדוגמה "ספינה", "אוטובוס"):', shipDefault: 'המיקום שלי', min: 'דקות הליכה', departLabel: 'שעת יציאה', enough: 'יש מספיק זמן, כ-{n} דקות בעתודה', notEnough: 'שימו לב: כ-{n} דקות איחור', route: 'מסלול', tap: 'או הקישו על המפה כדי לקבוע את המיקום שלכם.' }
};
const GPS_SPOT_KEY = 'rhineGuideSavedSpot';   // same key as the main app, so the ship point is shared
const GPS_DEPART_KEY = 'xmasDepart';
const TARGETS = PARTNERS.concat(SHOPS).map((p, i) => ({ slug: p.slug, name: p.name, ll: PLACES[i] }));
let gpsWatch = null, gpsPos = null, gpsMarker = null, gpsShipMarker = null, gpsOn = false;

function gl(k) { return (GPS[lang] || GPS.en)[k]; }
function walkMin(d) { return Math.max(1, Math.round(d * 1.3 / 75)); }
function distanceMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function bearingCompass(lat1, lng1, lat2, lng2) {
  const toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
  const y = Math.sin(toRad(lng2 - lng1)) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lng2 - lng1));
  const deg = (toDeg(Math.atan2(y, x)) + 360) % 360;
  return ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(deg / 45) % 8];
}
function formatDistance(d) {
  return d < 1000 ? `≈ ${Math.round(d / 10) * 10} m` : `≈ ${(d / 1000).toFixed(1)} km`;
}
function getSpot() { try { return JSON.parse(localStorage.getItem(GPS_SPOT_KEY) || 'null'); } catch (e) { return null; } }
function setSpot(s) { try { localStorage.setItem(GPS_SPOT_KEY, JSON.stringify(s)); } catch (e) {} }
function getDepart() { try { return localStorage.getItem(GPS_DEPART_KEY) || ''; } catch (e) { return ''; } }
function setDepart(v) { try { localStorage.setItem(GPS_DEPART_KEY, v); } catch (e) {} }

function drawGpsMarkers() {
  if (gpsMarker) { map.removeLayer(gpsMarker); gpsMarker = null; }
  if (gpsShipMarker) { map.removeLayer(gpsShipMarker); gpsShipMarker = null; }
  if (gpsPos) gpsMarker = L.marker([gpsPos.lat, gpsPos.lng], { icon: L.divIcon({ className: '', html: '<div class="gps-user-halo"></div>', iconSize: [22, 22], iconAnchor: [11, 11] }), zIndexOffset: 1000 }).addTo(map);
  const sp = getSpot();
  if (sp) gpsShipMarker = L.marker([sp.lat, sp.lng], { icon: L.divIcon({ className: '', html: '<div class="saved-spot-marker">📌</div>', iconSize: [30, 30], iconAnchor: [15, 28] }), zIndexOffset: 900 }).addTo(map);
}

function renderGpsPanel() {
  const box = document.getElementById('gpsBox');
  const panel = document.getElementById('gpsPanel');
  const sp0 = getSpot();
  if (!gpsOn && !sp0) { box.hidden = true; panel.innerHTML = ''; return; }
  box.hidden = false;
  if (!gpsPos) {
    let h = gpsOn ? `<p class="gps-hint">${gl('locating')}</p>` : '';
    h += `<p class="gps-hint">${gl('tap')}</p>`;
    if (sp0) h += `<div class="gps-ship"><div class="gps-row" style="border:0;padding:0"><span class="nm">📌 ${sp0.label}</span></div><button class="btn" id="gpsShipClear">${gl('clearShip')}</button></div>`;
    panel.innerHTML = h;
    return;
  }
  const p = gpsPos;
  const fmt = ll => {
    const d = distanceMeters(p.lat, p.lng, ll[0], ll[1]);
    return `<b>${formatDistance(d)} ${bearingCompass(p.lat, p.lng, ll[0], ll[1])}</b> <small>${walkMin(d)} ${gl('min')}</small>`;
  };
  const rows = TARGETS.map(t => ({ t, d: distanceMeters(p.lat, p.lng, t.ll[0], t.ll[1]) })).sort((a, b) => a.d - b.d);
  let html = rows.map(r => `<div class="gps-row"><span class="nm"><a href="#card-${r.t.slug}">${r.t.name}</a></span>${fmt(r.t.ll)}` +
    `<a class="route" href="https://www.google.com/maps/dir/?api=1&destination=${r.t.ll[0]},${r.t.ll[1]}&travelmode=walking" target="_blank" rel="noopener">${gl('route')} →</a></div>`).join('');
  const sp = getSpot();
  const depart = getDepart();
  if (sp) {
    const d = distanceMeters(p.lat, p.lng, sp.lat, sp.lng);
    html += `<div class="gps-ship"><div class="gps-row" style="border:0;padding:0"><span class="nm">📌 ${sp.label}</span>${fmt([sp.lat, sp.lng])}` +
      `<a class="route" href="https://www.google.com/maps/dir/?api=1&destination=${sp.lat},${sp.lng}&travelmode=walking" target="_blank" rel="noopener">${gl('route')} →</a></div>`;
    if (/^\d{2}:\d{2}$/.test(depart)) {
      const [hh, mm] = depart.split(':').map(Number);
      const dep = new Date(); dep.setHours(hh, mm, 0, 0);
      const margin = Math.round((dep - new Date()) / 60000 - walkMin(d));
      html += `<div class="gps-time ${margin >= 0 ? 'ok' : 'late'}">${(margin >= 0 ? gl('enough') : gl('notEnough')).replace('{n}', Math.abs(margin))}</div>`;
    }
    html += `<button class="btn" id="gpsShipClear">${gl('clearShip')}</button></div>`;
  } else {
    html += `<div class="gps-ship"><button class="btn solid" id="gpsShipSave">${gl('saveShip')}</button></div>`;
  }
  html += `<label class="gps-depart">${gl('departLabel')} <input type="time" id="gpsDepart" value="${depart}"></label>`;
  panel.innerHTML = html;
}

function startGps() {
  if (!navigator.geolocation) { gpsPos = null; document.getElementById('gpsPanel').innerHTML = `<p class="gps-hint">${gl('err')}</p>`; return; }
  if (gpsWatch !== null) return;
  gpsWatch = navigator.geolocation.watchPosition(pos => {
    gpsPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    drawGpsMarkers();
    renderGpsPanel();
  }, () => {
    gpsPos = null;
    navigator.geolocation.clearWatch(gpsWatch);
    gpsWatch = null;
    document.getElementById('gpsPanel').innerHTML = `<p class="gps-hint">${gl('err')}</p>`;
  }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 });
}

function updateGpsUi() {
  const b = document.getElementById('gpsBtn');
  b.textContent = '📍 ' + gl('btn');
  b.classList.toggle('solid', !gpsOn);
  renderGpsPanel();
}
document.getElementById('gpsBtn').addEventListener('click', () => {
  gpsOn = !gpsOn;
  if (gpsOn) { startGps(); if (!gpsPos) renderGpsPanel(); }
  updateGpsUi();
});
document.getElementById('gpsBox').addEventListener('click', e => {
  if (e.target.id === 'gpsShipSave') {
    if (!gpsPos) return;
    const label = window.prompt(gl('shipPrompt'), gl('shipDefault'));
    if (label === null) return;
    setSpot({ lat: gpsPos.lat, lng: gpsPos.lng, label: (label || gl('shipDefault')).trim() });
    drawGpsMarkers(); renderGpsPanel();
  }
  if (e.target.id === 'gpsShipClear') {
    try { localStorage.removeItem(GPS_SPOT_KEY); } catch (err) {}
    drawGpsMarkers(); renderGpsPanel();
  }
});
document.getElementById('gpsBox').addEventListener('change', e => {
  if (e.target.id === 'gpsDepart') { setDepart(e.target.value); renderGpsPanel(); }
});
// Eigene Position per Antippen der Karte setzen (ohne GPS möglich)
map.on('click', e => {
  const label = window.prompt(gl('shipPrompt'), gl('shipDefault'));
  if (label === null) return;
  setSpot({ lat: e.latlng.lat, lng: e.latlng.lng, label: (label || gl('shipDefault')).trim() });
  drawGpsMarkers(); renderGpsPanel();
});
setInterval(() => { if (gpsOn && gpsPos) renderGpsPanel(); }, 30000);

  const cafes = PARTNERS.map((p, i) => partnerCard(p, i + 1)).join('');
  const placeholders = PLACES.slice(PARTNERS.length + SHOPS.length).map((_, i) =>
    `<div class="card"><div class="num">${String(i + 1).padStart(2, '0')}</div><div class="ph">${t.ph}</div></div>`).join('');
  const shops = SHOPS.map((p, i) => partnerCard(p, i + 1)).join('');

  document.getElementById('cards').innerHTML =
    `<h2 class="sec" id="sec-cafe">${t.secCafe}</h2>${cafes}` +

  document.getElementById('cp-brand').textContent = t.cpBrand;
  document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('active', b.dataset.l === lang));
  renderCoupon();
  updateGpsUi();
}
document.getElementById('ptabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]');
  if (!b) return;
  view = b.dataset.v;
  render();
  window.scrollTo(0, 0);
});
document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.l;
  try { localStorage.setItem('partnerLang', lang); } catch (e) {}
  render();
}));
render();

const splashEl = document.getElementById('foodSplash');
function markSplashLang() {

}
markSplashLang();
splashEl.addEventListener('click', e => {
