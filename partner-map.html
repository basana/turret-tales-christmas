<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food, Drinks & More · Turret Tales</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root { --cream:#F5ECD6; --paper:#FBF6EA; --maroon:#7A1026; --ink:#3a2a1a; --soft:#6b5a4a; --gold:#c9a05c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--cream); color: var(--ink); font-family: 'EB Garamond', Georgia, serif; }
  body { padding: 0 16px 40px; max-width: 560px; margin: 0 auto; }
  header { padding: 22px 0 10px; text-align: center; }
  .brand { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); font-family: Helvetica, Arial, sans-serif; }
  h1 { font-size: 30px; color: var(--maroon); margin: 6px 0 4px; font-weight: 700; }
  .sub { font-size: 17px; color: var(--soft); margin: 0; }
  .langs { display: flex; justify-content: center; gap: 6px; margin: 14px 0 6px; }
  .langs button { font-family: Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 14px; border: 1px solid var(--maroon); background: #fff; color: var(--maroon); cursor: pointer; }
  .langs button.active { background: var(--maroon); color: #fff; }
  .intro { background: var(--paper); border: 1px solid var(--gold); border-radius: 12px; padding: 14px 16px; margin: 14px 0; font-size: 17px; line-height: 1.5; }
  #map { width: 100%; height: 420px; border-radius: 12px; border: 1px solid var(--gold); margin: 6px 0 12px; }
  .secnav { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 0 0 6px; }
  .secnav a { font-family: Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 14px; border: 1px solid var(--maroon); color: var(--maroon); text-decoration: none; background: #fff; }
  .sec { font-size: 22px; color: var(--maroon); margin: 22px 0 10px; font-weight: 700; border-bottom: 1px solid var(--gold); padding-bottom: 4px; scroll-margin-top: 12px; }
  .card { background: var(--paper); border: 1px solid var(--gold); border-radius: 12px; padding: 12px; margin: 0 0 12px; display: flex; gap: 12px; align-items: center; }
  .card .num { font-family: Helvetica, Arial, sans-serif; font-weight: 700; color: var(--maroon); font-size: 14px; min-width: 26px; }
  .card .ph { flex: 1; border: 1px dashed var(--maroon); border-radius: 8px; padding: 14px 10px; text-align: center; color: var(--maroon); font-size: 15px; }
  .partner { background: var(--paper); border: 1px solid var(--gold); border-radius: 12px; padding: 14px; margin: 0 0 12px; }
  .partner-head { display: flex; gap: 12px; align-items: center; }
  .partner-icon { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid var(--maroon); flex: none; }
  .partner-initial { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--maroon); flex: none; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; color: var(--maroon); background: #fff; }
  .partner-name { font-size: 21px; font-weight: 700; color: var(--maroon); margin: 0; line-height: 1.2; }
  .partner-cat { font-family: Helvetica, Arial, sans-serif; font-size: 12px; color: var(--soft); margin-top: 2px; }
  .partner-photo { display: block; width: 100%; height: auto; border-radius: 8px; margin: 12px 0 10px; }
  .photo-slot { border: 1px dashed var(--maroon); border-radius: 8px; padding: 22px 10px; text-align: center; color: var(--maroon); font-size: 14px; margin: 12px 0 10px; }
  .partner-desc { font-size: 17px; line-height: 1.5; margin: 0 0 10px; }
  .partner-meta { font-family: Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.6; color: var(--ink); margin: 0; }
  .partner-meta dt { display: inline; font-weight: 700; color: var(--maroon); }
  .partner-meta dd { display: inline; margin: 0; }
  .partner-meta div { margin: 0 0 2px; }
  .partner-meta a { color: var(--maroon); }
  .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 12px 0 10px; }
  .gallery img { width: 100%; height: auto; border-radius: 8px; display: block; }
  .gallery img:first-child { grid-column: span 2; }
  .pending { color: var(--soft); font-style: italic; }
  .partner-link { display: inline-block; margin-top: 10px; font-family: Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; padding: 7px 14px; border-radius: 14px; background: var(--maroon); color: #fff; text-decoration: none; }
  .contact { margin-top: 22px; background: var(--paper); border: 1px solid var(--gold); border-radius: 12px; padding: 14px 16px; font-size: 16px; line-height: 1.5; }
  .contact a { color: var(--maroon); }
  .legal { margin-top: 18px; padding-top: 10px; border-top: 1px solid rgba(122,16,38,.25); font-family: Helvetica, Arial, sans-serif; font-size: 12px; color: var(--soft); text-align: center; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #C0202A; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .pin { width: 56px; height: 56px; border-radius: 50%; background: #fff; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--maroon), 0 3px 8px rgba(0,0,0,.35); overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .pin img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pin span { font-family: Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; color: var(--maroon); }
</style>
</head>
<body>
<header>
  <div class="brand">Turret Tales · Tours All Year Round</div>
  <h1 id="t-title">Food, Drinks & More</h1>
  <p class="sub" id="t-sub">Cafés und Restaurants in der Altstadt</p>
  <div class="langs">
    <button data-l="de" class="active">DE</button>
    <button data-l="en">EN</button>
    <button data-l="fr">FR</button>
    <button data-l="nl">NL</button>
    <button data-l="ru">RU</button>
  </div>
</header>

<div class="intro" id="t-intro"></div>

<div id="map"></div>

<nav class="secnav" id="secnav"></nav>

<div id="cards"></div>

<div class="contact" id="t-contact"></div>

<div class="legal">© 2026 Team TAYR &amp; Anatoly Basin</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const T = {
  fr: {
    title: 'Food, Drinks & More', sub: 'Cafés, restaurants et souvenirs dans la vieille ville',
    intro: 'Ici nous présentons les cafés, restaurants et boutiques de souvenirs que les visiteurs de Turret Tales peuvent recommander. Les points rouges indiquent les lieux sur la carte. Le programme partenaires démarre avec les marchés de Noël 2026.',
    ph: 'Partenaire à venir · description et photos à venir',
    secCafe: 'Cafés et restaurants', secShop: 'Souvenirs et livres', secMore: 'Autres partenaires',
    navCafe: 'Cafés & restaurants', navShop: 'Souvenirs & livres',
    addr: 'Adresse', hours: 'Horaires', phone: 'Téléphone', gmaps: 'Ouvrir dans Google Maps',
    pending: 'à venir', photoSlot: 'Photos à venir',
    contact: 'Intéressé par un partenariat ? Écrivez à <a href="mailto:allyearoundtour@gmail.com">allyearoundtour@gmail.com</a> ou appelez : <a href="tel:+491772850207">+49 177 285 0207</a>.'
  },
  nl: {
    title: 'Food, Drinks & More', sub: 'Cafés, restaurants en souvenirs in de oude stad',
    intro: 'Hier tonen we cafés, restaurants en souvenirwinkels die gasten van Turret Tales kunnen aanbevelen. De rode stippen tonen de plekken op de kaart. Het partnerprogramma start met de kerstmarkten 2026.',
    ph: "Partner volgt · beschrijving en foto's volgen",
    secCafe: 'Cafés en restaurants', secShop: 'Souvenirs en boeken', secMore: 'Meer partners',
    navCafe: 'Cafés & restaurants', navShop: 'Souvenirs & boeken',
    addr: 'Adres', hours: 'Openingstijden', phone: 'Telefoon', gmaps: 'Openen in Google Maps',
    pending: 'volgt', photoSlot: "Foto's volgen",
    contact: 'Interesse in een samenwerking? Schrijf naar <a href="mailto:allyearoundtour@gmail.com">allyearoundtour@gmail.com</a> of bel: <a href="tel:+491772850207">+49 177 285 0207</a>.'
  },
  de: {
    title: 'Food, Drinks & More', sub: 'Cafés, Restaurants und Souvenirs in der Altstadt',
    intro: 'Hier zeigen wir Cafés, Restaurants und Souvenirgeschäfte, die Gäste von Turret Tales empfehlen. Die roten Punkte zeigen die Orte auf der Karte. Das Partnerprogramm startet mit den Weihnachtsmärkten 2026.',
    ph: 'Partner folgt · Beschreibung und Fotos folgen',
    secCafe: 'Cafés und Restaurants', secShop: 'Souvenirs und Bücher', secMore: 'Weitere Partner', navCafe: 'Cafés & Restaurants', navShop: 'Souvenirs & Bücher',
    addr: 'Adresse', hours: 'Öffnungszeiten', phone: 'Telefon', gmaps: 'Auf Google Maps öffnen',
    pending: 'folgt', photoSlot: 'Fotos folgen',
    contact: 'Interesse an einer Partnerschaft? Schreiben Sie an <a href="mailto:allyearoundtour@gmail.com">allyearoundtour@gmail.com</a> oder rufen Sie an: <a href="tel:+491772850207">+49 177 285 0207</a>.'
  },
  en: {
    title: 'Food, Drinks & More', sub: 'Cafés, restaurants and souvenirs in the old town',
    intro: 'Here we show cafés, restaurants and souvenir shops that Turret Tales guests can recommend. The red dots show the places on the map. The partner programme starts with the Christmas markets 2026.',
    ph: 'Partner to follow · description and photos to follow',
    secCafe: 'Cafés and restaurants', secShop: 'Souvenirs and books', secMore: 'More partners', navCafe: 'Cafés & restaurants', navShop: 'Souvenirs & books',
    addr: 'Address', hours: 'Opening hours', phone: 'Phone', gmaps: 'Open in Google Maps',
    pending: 'to follow', photoSlot: 'Photos to follow',
    contact: 'Interested in a partnership? Write to <a href="mailto:allyearoundtour@gmail.com">allyearoundtour@gmail.com</a> or call <a href="tel:+491772850207">+49 177 285 0207</a>.'
  },
  ru: {
    title: 'Food, Drinks & More', sub: 'Кафе, рестораны и сувениры в старом городе',
    intro: 'Здесь мы показываем кафе, рестораны и магазины сувениров, которые гостям Turret Tales могут порекомендовать. Красные точки — места на карте. Программа партнёров стартует вместе с рождественскими рынками 2026.',
    ph: 'Партнёр будет добавлен · описание и фото позже',
    secCafe: 'Кафе и рестораны', secShop: 'Сувениры и книги', secMore: 'Другие партнёры', navCafe: 'Кафе и рестораны', navShop: 'Сувениры и книги',
    addr: 'Адрес', hours: 'Часы работы', phone: 'Телефон', gmaps: 'Открыть в Google Maps',
    pending: 'скоро', photoSlot: 'Фото будут добавлены',
    contact: 'Интересно партнёрство? Напишите на <a href="mailto:allyearoundtour@gmail.com">allyearoundtour@gmail.com</a> или позвоните: <a href="tel:+491772850207">+49 177 285 0207</a>.'
  }
};

// Cafés and restaurants with full cards. Placeholder cards fill the remaining map dots.
const PARTNERS = [
  {
    slug: 'mia',
    name: 'Mia Gelateria',
    icon: 'mia-gelateria-icon.webp',
    photos: ['mia-gelateria-1.webp'],
    photoAlt: 'Mia Gelateria: Becher mit Softeis, Beeren und Schokolade',
    cat: { de: 'Eisdiele · Selbstbedienung', en: 'Ice cream parlour · self-service', ru: 'Мороженое · самообслуживание', fr: 'Glacier · libre-service', nl: 'IJssalon · zelfbediening' },
    addr: 'Rheinstr. 17, 56068 Koblenz (Altstadt)',
    hours: { de: 'täglich 12–21 Uhr', en: 'daily 12:00–21:00', ru: 'ежедневно 12:00–21:00', fr: 'tous les jours 12h–21h', nl: 'dagelijks 12–21 uur' },
    phone: '+49 261 97381344',
    gmaps: 'https://maps.app.goo.gl/sRjWmqWKR9dxL9Lx7',
    desc: {
      de: 'Eis in Selbstbedienung: Sie füllen Ihr Softeis selbst in den Becher und mischen bis zu acht Sorten. Bezahlt wird am Ende nach Gewicht. Auch die Toppings wählen Sie selbst.',
      en: 'Self-service ice cream: fill your soft serve into the cup yourself and mix up to eight flavours. You pay at the end by weight. You choose the toppings yourself too.',
      ru: 'Мороженое в самообслуживании: сами наливаете софт-мороженое в стаканчик и смешиваете до восьми вкусов. Оплата в конце — по весу. Топпинги тоже выбираете сами.',
      fr: "Glace en libre-service : remplissez vous-même votre soft dans le gobelet et mélangez jusqu'à huit parfums. Vous payez à la fin au poids. Les garnitures se choisissent aussi librement.",
      nl: 'Zelfbediening-ijs: vul uw softijs zelf in het bakje en meng tot acht smaken. U betaalt aan het eind op gewicht. Ook de toppings kiest u zelf.'
    }
  }
];

// Souvenir shops and bookshops. Details marked as pending until confirmed with the owner.
const SHOPS = [
  {
    slug: 'reuffel',
    name: 'Reuffel Bazaar',
    initial: 'R',
    photos: ['reuffel-1.webp', 'reuffel-2.webp', 'reuffel-3.webp', 'reuffel-4.webp'],
    cat: { de: 'Bücher · Souvenirs · Postkarten', en: 'Books · souvenirs · postcards', ru: 'Книги · сувениры · открытки', fr: 'Livres · souvenirs · cartes postales', nl: 'Boeken · souvenirs · ansichtkaarten' },
    addr: 'An der Liebfrauenkirche 11, 56068 Koblenz',
    hours: null,
    phone: '+49 261 94292194',
    web: 'https://www.reuffel.de',
    gmaps: 'https://maps.app.goo.gl/1BWsWVnWy1G8EJHT7',
    desc: {
      de: 'Bücher, Souvenirs und Postkarten aus Koblenz. Hier gibt es auch Postkarten von Turret Tales.',
      en: 'Books, souvenirs and postcards from Koblenz. Turret Tales postcards are sold here too.',
      ru: 'Книги, сувениры и открытки из Кобленца. Здесь также продаются открытки Turret Tales.',
      fr: 'Livres, souvenirs et cartes postales de Coblence. On trouve ici aussi les cartes postales de Turret Tales.',
      nl: 'Boeken, souvenirs en ansichtkaarten uit Koblenz. Hier zijn ook ansichtkaarten van Turret Tales te koop.'
    }
  }
];

// Map dots (placeholder positions for the planned partners).
const PLACES = [
  [50.36000, 7.60203],  // Mia Gelateria
  [50.36098, 7.59604],  // Reuffel Bazaar
  [50.36133, 7.59590], [50.36106, 7.59460], [50.36178, 7.59470],
  [50.36070, 7.59684], [50.36183, 7.59597]
];
let lang = 'de';
try { const s = localStorage.getItem('partnerLang'); if (s && T[s]) lang = s; } catch (e) {}

const map = L.map('map', { scrollWheelZoom: false, zoomSnap: 0 });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(map);
map.fitBounds(L.latLngBounds(PLACES), { padding: [6, 6], maxZoom: 16 });
// The first two points carry the partners' logos (Mia, Reuffel); the rest stay as red dots.
const PIN_LOGOS = [
  { html: '<img src="mia-gelateria-icon.webp" alt="Mia Gelateria">', card: 'card-mia' },
  { html: '<span>R</span>', card: 'card-reuffel' }
];
PLACES.forEach((ll, i) => {
  const logo = PIN_LOGOS[i];
  const icon = logo
    ? L.divIcon({ className: '', html: `<div class="pin">${logo.html}</div>`, iconSize: [56, 56], iconAnchor: [28, 28] })
    : L.divIcon({ className: '', html: '<div class="dot"></div>', iconSize: [14, 14], iconAnchor: [7, 7] });
  const m = L.marker(ll, { icon: icon }).addTo(map);
  if (logo) m.on('click', () => {
    const c = document.getElementById(logo.card);
    if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
});

function avatar(p) {
  return p.icon
    ? `<img class="partner-icon" src="${p.icon}" alt="${p.name}" width="64" height="64">`
    : `<div class="partner-initial" aria-hidden="true">${p.initial || p.name.charAt(0)}</div>`;
}

function partnerCard(p, n) {
  const t = T[lang];
  const photos = p.photos || [];
  const photo = photos.length
    ? `<div class="gallery">${photos.map((src, i) =>
        `<img src="${src}" alt="${i === 0 && p.photoAlt ? p.photoAlt : p.name}" loading="lazy">`).join('')}</div>`
    : `<div class="photo-slot">${t.photoSlot}</div>`;
  const val = (v, fallback) => v ? v : `<span class="pending">${t.pending}</span>`;
  const hours = p.hours ? (p.hours[lang] || p.hours.en) : null;
  const phoneRow = p.phone
    ? `<div><dt>${t.phone}:</dt> <dd><a href="tel:${p.phone.replace(/\s/g, '')}">${p.phone}</a></dd></div>` : '';
  const webRow = p.web
    ? `<div><dt>Web:</dt> <dd><a href="${p.web}" target="_blank" rel="noopener">${p.web.replace('https://', '')}</a></dd></div>` : '';
  const link = p.gmaps
    ? `<a class="partner-link" href="${p.gmaps}" target="_blank" rel="noopener">${t.gmaps} →</a>` : '';
  return `<article class="partner" id="card-${p.slug}">
    <div class="partner-head">
      ${avatar(p)}
      <div>
        <h3 class="partner-name">${String(n).padStart(2, '0')} · ${p.name}</h3>
        <div class="partner-cat">${p.cat[lang] || p.cat.en}</div>
      </div>
    </div>
    ${photo}
    <p class="partner-desc">${p.desc[lang] || p.desc.en}</p>
    <dl class="partner-meta">
      <div><dt>${t.addr}:</dt> <dd>${val(p.addr)}</dd></div>
      <div><dt>${t.hours}:</dt> <dd>${val(hours)}</dd></div>
      ${phoneRow}
      ${webRow}
    </dl>
    ${link}
  </article>`;
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById('t-title').textContent = t.title;
  document.getElementById('t-sub').textContent = t.sub;
  document.getElementById('t-intro').textContent = t.intro;
  document.getElementById('t-contact').innerHTML = t.contact;
  document.title = t.title + ' · Turret Tales';
  document.getElementById('secnav').innerHTML =
    `<a href="#sec-cafe">${t.navCafe}</a><a href="#sec-shop">${t.navShop}</a>`;

  const cafes = PARTNERS.map((p, i) => partnerCard(p, i + 1)).join('');
  const placeholders = PLACES.slice(PARTNERS.length + SHOPS.length).map((_, i) =>
    `<div class="card"><div class="num">${String(i + 1).padStart(2, '0')}</div><div class="ph">${t.ph}</div></div>`).join('');
  const shops = SHOPS.map((p, i) => partnerCard(p, i + 1)).join('');

  // Order: cafés, souvenir shops, then the remaining placeholder cards.
  document.getElementById('cards').innerHTML =
    `<h2 class="sec" id="sec-cafe">${t.secCafe}</h2>${cafes}` +
    `<h2 class="sec" id="sec-shop">${t.secShop}</h2>${shops}` +
    `<h2 class="sec" id="sec-more">${t.secMore}</h2>${placeholders}`;
  document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('active', b.dataset.l === lang));
}
document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.l;
  try { localStorage.setItem('partnerLang', lang); } catch (e) {}
  render();
}));
render();
</script>
</body>
</html>
