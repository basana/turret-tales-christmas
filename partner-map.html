<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partnerkarte Koblenz · Turret Tales</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root { --cream:#F5ECD6; --paper:#FBF6EA; --maroon:#7A1026; --ink:#3a2a1a; --soft:#6b5a4a; --gold:#c9a05c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--cream); color: var(--ink); font-family: 'EB Garamond', Georgia, serif; }
  body { padding: 0 16px 40px; max-width: 560px; margin: 0 auto; }
  header { padding: 22px 0 10px; text-align: center; }
  .brand { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); font-family: Helvetica, Arial, sans-serif; }
  h1 { font-size: 30px; color: var(--maroon); margin: 6px 0 4px; font-weight: 700; }
  .sub { font-size: 17px; color: var(--soft); margin: 0; }
  .langs { display: flex; justify-content: center; gap: 6px; margin: 14px 0 6px; }
  .langs button { font-family: Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 14px; border: 1px solid var(--maroon); background: #fff; color: var(--maroon); cursor: pointer; }
  .langs button.active { background: var(--maroon); color: #fff; }
  .intro { background: var(--paper); border: 1px solid var(--gold); border-radius: 12px; padding: 14px 16px; margin: 14px 0; font-size: 17px; line-height: 1.5; }
  #map { width: 100%; height: 420px; border-radius: 12px; border: 1px solid var(--gold); margin: 6px 0 16px; }
  .card { background: var(--paper); border: 1px solid var(--gold); border-radius: 12px; padding: 12px; margin: 0 0 12px; display: flex; gap: 12px; align-items: center; }
  .card .num { font-family: Helvetica, Arial, sans-serif; font-weight: 700; color: var(--maroon); font-size: 14px; min-width: 26px; }
  .card .ph { flex: 1; border: 1px dashed var(--maroon); border-radius: 8px; padding: 14px 10px; text-align: center; color: var(--maroon); font-size: 15px; }
  .contact { margin-top: 22px; background: var(--paper); border: 1px solid var(--gold); border-radius: 12px; padding: 14px 16px; font-size: 16px; line-height: 1.5; }
  .contact a { color: var(--maroon); }
  .legal { margin-top: 18px; padding-top: 10px; border-top: 1px solid rgba(122,16,38,.25); font-family: Helvetica, Arial, sans-serif; font-size: 12px; color: var(--soft); text-align: center; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #C0202A; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
</style>
</head>
<body>
<header>
  <div class="brand">Turret Tales · Tours All Year Round</div>
  <h1 id="t-title">Partnerkarte Koblenz</h1>
  <p class="sub" id="t-sub">Cafés und Restaurants in der Altstadt</p>
  <div class="langs">
    <button data-l="de" class="active">DE</button>
    <button data-l="en">EN</button>
    <button data-l="ru">RU</button>
  </div>
</header>

<div class="intro" id="t-intro"></div>

<div id="map"></div>

<div id="cards"></div>

<div class="contact" id="t-contact"></div>

<div class="legal">© 2026 Team TAYR &amp; Anatoly Basin</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const T = {
  de: {
    title: 'Partnerkarte Koblenz', sub: 'Cafés und Restaurants in der Altstadt',
    intro: 'Hier zeigen wir Cafés und Restaurants, die Gäste von Turret Tales empfehlen. Die roten Punkte zeigen die Orte auf der Karte. Das Partnerprogramm startet mit den Weihnachtsmärkten 2026.',
    ph: 'Partner folgt · Beschreibung und Fotos folgen',
    contact: 'Interesse an einer Partnerschaft? Schreiben Sie an <a href="mailto:allyearoundtour@gmail.com">allyearoundtour@gmail.com</a> oder rufen Sie an: <a href="tel:+491772850207">+49 177 285 0207</a>.'
  },
  en: {
    title: 'Partner map Koblenz', sub: 'Cafés and restaurants in the old town',
    intro: 'Here we show cafés and restaurants that Turret Tales guests can recommend. The red dots show the places on the map. The partner programme starts with the Christmas markets 2026.',
    ph: 'Partner to follow · description and photos to follow',
    contact: 'Interested in a partnership? Write to <a href="mailto:allyearoundtour@gmail.com">allyearoundtour@gmail.com</a> or call <a href="tel:+491772850207">+49 177 285 0207</a>.'
  },
  ru: {
    title: 'Карта партнёров · Кобленц', sub: 'Кафе и рестораны в старом городе',
    intro: 'Здесь мы показываем кафе и рестораны, которые гостям Turret Tales могут порекомендовать. Красные точки — места на карте. Программа партнёров стартует вместе с рождественскими рынками 2026.',
    ph: 'Партнёр будет добавлен · описание и фото позже',
    contact: 'Интересно партнёрство? Напишите на <a href="mailto:allyearoundtour@gmail.com">allyearoundtour@gmail.com</a> или позвоните: <a href="tel:+491772850207">+49 177 285 0207</a>.'
  }
};
const PLACES = [
  [50.36139, 7.59636], [50.36133, 7.59590], [50.36106, 7.59460], [50.36178, 7.59470],
  [50.36070, 7.59684], [50.36183, 7.59597], [50.36144, 7.60450]
];
let lang = 'de';
try { const s = localStorage.getItem('partnerLang'); if (s && T[s]) lang = s; } catch (e) {}

const map = L.map('map', { scrollWheelZoom: false, zoomSnap: 0 });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(map);
map.fitBounds(L.latLngBounds(PLACES), { padding: [6, 6], maxZoom: 16 });
PLACES.forEach(ll => L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="dot"></div>', iconSize: [14, 14], iconAnchor: [7, 7] }) }).addTo(map));

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById('t-title').textContent = t.title;
  document.getElementById('t-sub').textContent = t.sub;
  document.getElementById('t-intro').textContent = t.intro;
  document.getElementById('t-contact').innerHTML = t.contact;
  document.title = t.title + ' · Turret Tales';
  document.getElementById('cards').innerHTML = PLACES.map((_, i) =>
    `<div class="card"><div class="num">${String(i + 1).padStart(2, '0')}</div><div class="ph">${t.ph}</div></div>`).join('');
  document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('active', b.dataset.l === lang));
}
document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.l;
  try { localStorage.setItem('partnerLang', lang); } catch (e) {}
  render();
}));
render();
</script>
</body>
</html>
