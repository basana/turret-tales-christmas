<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winningen · Turret Tales</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root {
    --cream:#F5ECD6; --paper:#FBF6EA; --maroon:#7A1026; --ink:#3a2a1a; --soft:#6b5a4a; --gold:#c9a05c; --ok:#2f6b3a;
    --terracotta:#B5602E; --cream-text:#FCEFDD; --pad: clamp(16px, 5vw, 24px);
    --sans: Helvetica, Arial, sans-serif;
    /* Einheitliche Typo-Skala — jede Größe hat genau eine Rolle */
    --fs-h1: 28px;     /* Seitentitel */
    --fs-h2: 22px;     /* Abschnitts-/Kartentitel (Wanderungsname, Weingut, Rubrik) */
    --fs-h3: 18px;     /* Unterüberschriften */
    --fs-stat: 18px;   /* Zahl in den Kennzahlen-Kacheln */
    --fs-lead: 17px;   /* Fließtext-Absätze (Intro, Beschreibung) */
    --fs-body: 15px;   /* Listen, Standardtext */
    --fs-small: 13px;  /* Tags, Meta-Zeilen, Buttons */
    --fs-micro: 12px;  /* Eyebrow, Fußzeile, Bildunterschrift */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--cream); color: var(--ink); font-family: 'EB Garamond', Georgia, serif; }
  body { padding: 0 16px 40px; max-width: 560px; margin: 0 auto; }
  header { padding: 22px 0 10px; text-align: center; }
  .brand { font-size: var(--fs-small); letter-spacing: .08em; text-transform: uppercase; color: var(--soft); font-family: var(--sans); }
  h1 { font-size: var(--fs-h1); color: var(--maroon); margin: 6px 0 4px; font-weight: 700; }
  .sub { font-size: var(--fs-lead); color: var(--soft); margin: 0; }
  .langs { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin: 14px 0 6px; }
  .langs button { font-family: var(--sans); font-size: var(--fs-micro); font-weight: 700; padding: 5px 12px; border-radius: 14px; border: 1px solid var(--maroon); background: #fff; color: var(--maroon); cursor: pointer; }
  .langs button.active { background: var(--maroon); color: #fff; }
  .intro { background: var(--paper); border: 1px solid var(--gold); border-radius: 12px; padding: 14px 16px; margin: 14px 0; font-size: var(--fs-lead); line-height: 1.5; }
  .editorial { border-left: 3px solid var(--maroon); padding: 4px 0 4px 16px; margin: 0 0 14px; font-style: italic; font-size: var(--fs-lead); line-height: 1.55; color: var(--ink); overflow: hidden; }
  .editorial .sig { display: block; margin-top: 8px; font-style: normal; font-family: var(--sans); font-size: var(--fs-small); color: var(--maroon); font-weight: 600; clear: left; }
  /* Портрет гида — обтекание текстом по кругу, как в журнальной вёрстке */
  .editorial-photo {
    float: left; width: 72px; height: 72px; margin: 2px 12px 6px 0;
    border-radius: 50%; object-fit: cover; border: 1px solid var(--gold);
    transform: scaleX(-1); /* зеркально — гид смотрит вправо, на текст, а не в пустое поле слева */
    shape-outside: circle(50%); shape-margin: 6px;
  }
  /* Семейное фото-хедер над картами маршрутов (вкладка Walks) */
  .walks-hero { width: 100%; aspect-ratio: 1 / 1; border-radius: 14px; overflow: hidden; border: 1px solid var(--gold); margin: 0 0 16px; }
  .walks-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pending { color: var(--soft); font-style: italic; }
  .ptabs { display: flex; gap: 8px; overflow-x: auto; flex-wrap: nowrap; margin: 8px 0 14px; scrollbar-width: none; scroll-behavior: smooth; }
  .ptabs::-webkit-scrollbar { display: none; }
  .ptabs button { flex-shrink: 0; font-family: var(--sans); font-size: var(--fs-small); font-weight: 600; padding: 7px 15px; border-radius: 20px; border: 1.5px solid var(--gold); background: var(--paper); color: var(--soft); white-space: nowrap; cursor: pointer; transition: background .2s ease, color .2s ease; }
  .ptabs button.active { background: var(--maroon); border-color: var(--maroon); color: #fff; font-weight: 700; }

  .sec { font-size: var(--fs-h2); color: var(--maroon); margin: 18px 0 10px; font-weight: 700; border-bottom: 1px solid var(--gold); padding-bottom: 4px; }
  .card { background: var(--paper); border: 1px solid var(--gold); border-radius: 12px; padding: 12px; margin: 0 0 12px; display: flex; gap: 12px; align-items: center; }
  .card .num { font-family: var(--sans); font-weight: 700; color: var(--maroon); font-size: var(--fs-small); min-width: 26px; }
  .card .ph { flex: 1; border: 1px dashed var(--maroon); border-radius: 8px; padding: 14px 10px; text-align: center; color: var(--maroon); font-size: var(--fs-body); }
  .partner { background: var(--paper); border: 1px solid var(--gold); border-radius: 12px; padding: 14px; margin: 0 0 12px; }
  .partner-name { font-size: var(--fs-h2); font-weight: 700; color: var(--maroon); margin: 0; line-height: 1.2; }
  .partner-cat { font-family: var(--sans); font-size: var(--fs-micro); color: var(--soft); margin-top: 2px; }
  .partner-desc { font-size: var(--fs-lead); line-height: 1.5; margin: 10px 0; }
  .partner-meta { font-family: var(--sans); font-size: var(--fs-small); line-height: 1.6; color: var(--ink); margin: 0; }
  .partner-meta dt { display: inline; font-weight: 700; color: var(--maroon); }
  .partner-meta dd { display: inline; margin: 0; }
  .partner-meta div { margin: 0 0 2px; }
  .photo-slot { border: 1px dashed var(--maroon); border-radius: 8px; padding: 22px 10px; text-align: center; color: var(--maroon); font-size: var(--fs-small); margin: 0 0 14px; }
  .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 0 0 14px; }
  .gallery img { width: 100%; height: auto; border-radius: 8px; display: block; }
  .gallery img:first-child { grid-column: span 2; }

  /* === Карточка маршрута (вкладка «Wanderungen») === */
  .walk { background: var(--paper); border: 1px solid var(--gold); border-radius: 12px; padding: 16px; margin: 0 0 18px; }
  .walk-name { font-size: var(--fs-h2); font-weight: 700; color: var(--maroon); margin: 0 0 4px; }
  .walk-tag { font-family: var(--sans); font-size: var(--fs-small); color: var(--soft); margin: 0 0 12px; }
  .walk-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; margin: 0 0 14px; }
  .walk-stat { background: #fff; border: 1px solid var(--gold); border-radius: 10px; padding: 8px 6px; text-align: center; }
  .walk-stat b { display: block; font-size: var(--fs-stat); color: var(--maroon); font-family: var(--sans); line-height: 1.2; }
  .walk-stat span { font-family: var(--sans); font-size: 10.5px; color: var(--soft); text-transform: uppercase; letter-spacing: .02em; display: block; margin-top: 2px; }
  .walk-stat.wide { grid-column: 1 / -1; display: flex; flex-direction: row-reverse; align-items: baseline; justify-content: center; gap: 8px; padding: 10px 6px; }
  .walk-stat.wide b { display: inline; }
  .walk-stat.wide span { margin-top: 0; }
  .walk-desc { font-size: var(--fs-lead); line-height: 1.55; margin: 0 0 14px; }
  .walk-desc p { margin: 0 0 10px; }
  .walk-h3 { font-size: var(--fs-h3); color: var(--maroon); font-weight: 700; margin: 16px 0 8px; }
  .walk-poi { list-style: none; margin: 0 0 4px; padding: 0; }
  .poi-card { border: 1px solid rgba(201,160,92,.5); border-radius: 10px; padding: 12px 14px 14px; margin: 0 0 12px; background: var(--paper); }
  .poi-card .gallery, .poi-card .photo-slot { margin: 0 0 10px; }
  .poi-card .photo-slot { padding: 16px 10px; font-size: var(--fs-micro); }
  .poi-card .poi-km { color: var(--maroon); font-family: var(--sans); font-size: var(--fs-micro); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 3px; }
  .poi-card h4 { margin: 0 0 4px; font-size: var(--fs-h3); color: var(--ink); font-family: var(--sans); }
  .poi-card p { margin: 0; font-size: var(--fs-body); line-height: 1.5; }
  .walk-wear { margin: 0 0 4px; padding-left: 20px; font-size: var(--fs-body); line-height: 1.6; }
  .walk-wear li { margin: 0 0 4px; }
  .walk-profile { list-style: none; margin: 0 0 16px; padding: 0; }
  .walk-profile li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid rgba(201,160,92,.4); }
  .walk-profile li:first-child { border-top: 0; }
  .walk-profile .seg-bar { flex: 0 0 6px; align-self: stretch; border-radius: 4px; min-height: 36px; }
  .walk-profile .seg-bar.flach { background: #5b9e5b; }
  .walk-profile .seg-bar.leicht { background: #9ec15b; }
  .walk-profile .seg-bar.mittel { background: #d6a63a; }
  .walk-profile .seg-bar.steil { background: #b5402e; }
  .walk-profile .seg-body { flex: 1; font-size: var(--fs-body); line-height: 1.45; }
  .walk-profile .seg-head { font-family: var(--sans); font-size: var(--fs-small); font-weight: 700; color: var(--maroon); text-transform: uppercase; letter-spacing: .02em; display: block; margin-bottom: 2px; }
  .walk-profile .seg-change { font-weight: 400; color: var(--soft); text-transform: none; letter-spacing: 0; }
  .walk-suit { margin: 0 0 4px; padding-left: 20px; font-size: var(--fs-body); line-height: 1.6; }
  .walk-suit li { margin: 0 0 6px; }
  .walk-map-note { font-family: var(--sans); font-size: var(--fs-micro); color: var(--soft); line-height: 1.4; margin: 0 0 14px; }
  .walk-map-note a { color: var(--maroon); }
  .walk-start-marker { background: var(--maroon); color: #fff; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-family: Helvetica, Arial, sans-serif; font-weight: 700; font-size: 13px; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
  .walk-pier-badge { display: flex; align-items: center; gap: 6px; background: #fff; color: #222; border: 2px solid #B8860B; border-radius: 999px; padding: 2px 10px 2px 2px; font-family: var(--sans); font-size: var(--fs-micro); font-weight: 700; letter-spacing: .02em; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.35); transform: translate(-50%, -50%); }
  .walk-pier-letter { width: 22px; height: 22px; border-radius: 50%; background: #B8860B; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex: 0 0 auto; }

  /* === История и достопримечательности === */
  .hist { background: var(--paper); border: 1px solid var(--gold); border-radius: 12px; padding: 14px 16px; margin: 0 0 12px; }
  .hist h3 { font-size: var(--fs-h3); color: var(--maroon); margin: 0 0 6px; }
  .hist p { font-size: var(--fs-lead); line-height: 1.5; margin: 0 0 6px; }
  .hist .meta { font-family: var(--sans); font-size: var(--fs-micro); color: var(--soft); }

  .contact { margin-top: 22px; background: var(--paper); border: 1px solid var(--gold); border-radius: 12px; padding: 14px 16px; font-size: var(--fs-lead); line-height: 1.5; }
  .contact a { color: var(--maroon); }
  .legal { margin-top: 18px; padding-top: 10px; border-top: 1px solid rgba(122,16,38,.25); font-family: var(--sans); font-size: var(--fs-micro); color: var(--soft); text-align: center; }

  /* === Заставка (splash) первого экрана — по образцу index.html / partner-map.html ===
     Фото пока нет (splash-winningen.webp не существует) — img.onerror прячет
     картинку и остаётся фолбэк-градиент в тонах виноградника, чтобы экран не
     выглядел сломанным. Как только появится настоящее фото Винингена/Мозеля —
     просто положить файл splash-winningen.webp рядом, менять код не нужно. */
  .splash { position: fixed; inset: 0; z-index: 3000; display: flex; flex-direction: column; justify-content: flex-end; background: linear-gradient(160deg, #3c5a2e 0%, #5b7a3a 42%, #8a6a2e 100%); }
  .splash[hidden] { display: none; }
  .splash > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; }
  .splash-gradient { position: absolute; inset: 0; background: linear-gradient(45deg, rgba(12,8,4,0.78) 0%, rgba(12,8,4,0.4) 18%, rgba(12,8,4,0.08) 40%, rgba(12,8,4,0.25) 100%); }
  .splash-content { position: relative; z-index: 1; padding: 0 var(--pad) calc(64px + env(safe-area-inset-bottom)); color: var(--cream-text); }
  .splash-eyebrow { font-family: var(--sans); font-size: 12.4px; letter-spacing: 0.19em; text-transform: uppercase; color: var(--cream-text); font-weight: 700; opacity: 0.86; margin: 0 0 6px; text-shadow: 0 2px 10px rgba(0,0,0,0.65), 0 1px 3px rgba(0,0,0,0.8); display: block; }
  .splash-title, .splash-find { font-family: 'EB Garamond', Garamond, serif; font-weight: 600; font-style: normal; font-size: clamp(30px, 8.3vw, 42px); line-height: 1.05; text-shadow: 0 2px 16px rgba(0,0,0,0.45); color: var(--cream-text); }
  .splash-title { margin: 0 0 9px; }
  .splash-find { display: block; text-align: left; margin: 0 0 26px; padding-left: 19%; font-size: calc(clamp(30px, 8.3vw, 42px) * 0.77); font-style: italic; font-synthesis: style; }
  .splash-tagline { font-size: clamp(19px, 5vw, 21px); line-height: 1.42; margin: 0 0 10px; max-width: 34ch; color: rgba(252,239,221,0.92); }
  .splash-enter { font-family: var(--sans); background: var(--terracotta); color: var(--cream-text); border: none; border-radius: 28px; padding: 14px 30px; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .splash-lang { position: absolute; z-index: 2; top: calc(14px + env(safe-area-inset-top)); right: 14px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: 70%; }
  .splash-lang-btn { font-family: var(--sans); font-size: 11.5px; font-weight: 700; padding: 6px 10px; border-radius: 14px; cursor: pointer; background: #fff; color: var(--maroon); border: 1px solid var(--maroon); }
  .splash-lang-btn.active { background: var(--terracotta); color: var(--cream-text); border-color: var(--terracotta); }

  /* ============ RTL (иврит) ============ */
  [dir="rtl"] .splash-find { text-align: right; padding-left: 0; padding-right: 19%; }
  [dir="rtl"] .splash-lang { right: auto; left: 14px; justify-content: flex-start; }
  [dir="rtl"] .editorial { border-left: none; border-right: 3px solid var(--maroon); padding: 4px 16px 4px 0; }
  [dir="rtl"] .editorial .sig { clear: right; }
  [dir="rtl"] .editorial-photo { float: right; margin: 2px 0 6px 12px; transform: none; }
  [dir="rtl"] .walk-wear, [dir="rtl"] .walk-suit { padding-left: 0; padding-right: 20px; }
</style>
</head>

  <div class="splash-lang">
    <span class="splash-lang-btn" data-lang="de">DE</span>

    <span class="splash-lang-btn" data-lang="ru">RU</span>

  L.marker(w.startLL, { icon: L.divIcon({ className: '', html: `<div class="walk-start-marker">S</div>`, iconSize: [30, 30], iconAnchor: [15, 15] }) })
    .addTo(map).bindTooltip(t.legStart + ' · ' + w.startName, { direction: 'top' });
  L.marker(w.pierLL, { icon: L.divIcon({ className: '', html: `<div class="walk-pier-badge"><span class="walk-pier-letter">K</span>KD PIER</div>`, iconSize: null, iconAnchor: [0, 0] }) })
    .addTo(map).bindTooltip('KD · ' + t.legPier + ' · ' + w.pierName, { direction: 'top' });
  L.polyline([w.pierLL, w.startLL], { color: '#2a7de1', weight: 3, dashArray: '2 8', opacity: .8 }).addTo(map);
  const [lat0, lng0] = w.startLL;
  // Schlaufenform grob an den vom Nutzer gezeigten Kartenausschnitt (outdooractive) angelehnt:
  // Hinweg über den oberen Weinhexweg nach NO, Rückweg etwas tiefer über Sternbergweg/Hohenrainweg.
  // Kein echter GPS-Track — siehe Hinweistext unter der Karte.
  const loop = [
    [lat0, lng0],
    [lat0 + 0.0020, lng0 + 0.0011], [lat0 + 0.0036, lng0 - 0.0016], [lat0 + 0.0056, lng0 + 0.0036],
    [lat0 + 0.0076, lng0 + 0.0086], [lat0 + 0.0094, lng0 + 0.0146],
    [lat0 + 0.0068, lng0 + 0.0126], [lat0 + 0.0038, lng0 + 0.0086], [lat0 + 0.0008, lng0 + 0.0046],
    [lat0 - 0.0007, lng0 + 0.0016],
    [lat0, lng0]
  ];
  L.polyline(loop, { color: '#7A1026', weight: 4, opacity: .85 }).addTo(map);
  map.fitBounds(L.latLngBounds([w.pierLL, w.startLL, ...loop]), { padding: [20, 20], maxZoom: 15 });
}

// ---- Weingüter ----
function avatar(p) {
  return p.icon ? `<img class="partner-icon" src="${p.icon}" alt="${p.name}" width="64" height="64">` : '';
}
function wineryCard(p) {
  const t = T[lang];
  const val = v => v ? v : `<span class="pending">${t.pending}</span>`;
  const hours = p.hours ? (p.hours[lang] || p.hours.en) : null;
  const phoneRow = p.phone ? `<div><dt>${t.phone}:</dt> <dd><a href="tel:${p.phone.replace(/\s/g, '')}">${p.phone}</a></dd></div>` : '';
  const webRow = p.web ? `<div><dt>Web:</dt> <dd><a href="${p.web}" target="_blank" rel="noopener">${p.web.replace('https://', '')}</a></dd></div>` : '';
  const meta = `<dl class="partner-meta"><div><dt>${t.addr}:</dt> <dd>${val(p.addr)}</dd></div><div><dt>${t.hours}:</dt> <dd>${val(hours)}</dd></div>${phoneRow}${webRow}</dl>`;
  const descText = p.desc ? (p.desc[lang] || p.desc.en) : '';
  return `<article class="partner" id="winery-${p.slug}">
    <h3 class="partner-name">${p.name}</h3>
    <p class="partner-cat">${p.cat ? (p.cat[lang] || p.cat.en) : ''}</p>
    <p class="partner-desc">${descText}</p>
    ${meta}
  </article>`;
}

// ---- Sehenswürdigkeiten ----
function sightCard(s) {
  return `<div class="hist"><h3>${s.title[lang] || s.title.en}</h3><p>${s.text[lang] || s.text.en}</p></div>`;
}

// ---- Weihnachtsmarkt ----
function xmasCard() {
  const t = T[lang];
  return `<div class="hist"><h3>${XMAS.title[lang] || XMAS.title.en}</h3>
    <p class="meta">${XMAS.date[lang] || XMAS.date.en} · ${XMAS.place[lang] || XMAS.place.en}</p>
    <p>${XMAS.text[lang] || XMAS.text.en}</p></div>`;
}

function render() {
  const t = T[lang];
  const tt = TABS[lang] || TABS.en;
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'he') ? 'rtl' : 'ltr';
  document.getElementById('t-brand').textContent = t.brand;
  document.getElementById('t-title').textContent = t.title;
  document.getElementById('t-sub').textContent = t.sub;
  // «Слово от гида» с фото — только на вкладке Walks (2-й экран после заставки),
  // на остальных вкладках (Wine/Sights/Food/Xmas) не повторяется.
  const editorialEl = document.getElementById('t-editorial');
  editorialEl.hidden = view !== 'walks';
  if (view === 'walks') {
    editorialEl.innerHTML = `<img class="editorial-photo" src="guide-photo.webp" alt="Anatoly Basin">${t.letter}<span class="sig">— Anatoly Basin, Team TAYR</span>`;
  }
  document.getElementById('t-contact').innerHTML = t.contact;
  document.title = t.title + ' · Turret Tales';

  document.getElementById('ptabs').innerHTML = Object.keys(tt).map(k =>
    `<button data-v="${k}" class="${view === k ? 'active' : ''}">${tt[k]}</button>`).join('');
  ['walks', 'wine', 'sights', 'food', 'xmas'].forEach(k => {
    document.getElementById('view-' + k).hidden = view !== k;
  });

  if (view === 'walks') {
    // Фото семьи в рамке, под ним — вступительный текст о Виннингене.
    const heroHtml = `<div class="walks-hero"><img src="walks-hero-family.webp" alt="" loading="lazy"></div>
      <div class="intro" id="t-intro">${t.intro}</div>`;
    document.getElementById('view-walks').innerHTML = heroHtml + WALKS.map(walkCard).join('');
    WALKS.forEach(drawWalkMap);
  } else if (view === 'wine') {
    const cards = WINERIES.map(w => w.name ? wineryCard(w) : `<div class="card"><div class="num">W</div><div class="ph">${t.ph}</div></div>`).join('');
    document.getElementById('wine-cards').innerHTML = `<h2 class="sec">${t.secWine}</h2>${cards}`;
  } else if (view === 'sights') {
    document.getElementById('sights-cards').innerHTML = `<h2 class="sec">${t.secSights}</h2>${SIGHTS.slice(0, 3).map(sightCard).join('')}<h2 class="sec">${t.secHist}</h2>${SIGHTS.slice(3).map(sightCard).join('')}`;
  } else if (view === 'food') {
    document.getElementById('food-cards').innerHTML = `<h2 class="sec">${t.secFood}</h2><div class="card"><div class="num">01</div><div class="ph">${t.ph}</div></div>`;
  } else if (view === 'xmas') {
    document.getElementById('xmas-card').innerHTML = xmasCard();
  }
  document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('active', b.dataset.l === lang));
}
document.getElementById('ptabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]');
  if (!b) return;
  view = b.dataset.v;
  render();
  window.scrollTo(0, 0);
});
document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.l;
  try { localStorage.setItem('partnerLang', lang); } catch (e) {}
  render();
}));
render();
// Заставка при открытии: касание по ней скрывает её; кнопки языков сразу
// переключают страницу (как в index.html / partner-map.html).
const walksSplashEl = document.getElementById('walksSplash');
function markWalksSplashLang() {
  walksSplashEl.querySelectorAll('.splash-lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
}
markWalksSplashLang();
walksSplashEl.addEventListener('click', e => {
  const b = e.target.closest('.splash-lang-btn');
  if (b) {
    lang = b.dataset.lang;
    try { localStorage.setItem('partnerLang', lang); } catch (err) {}
    render();
    markWalksSplashLang();
  }
  walksSplashEl.hidden = true;
});
</script>
</body>
